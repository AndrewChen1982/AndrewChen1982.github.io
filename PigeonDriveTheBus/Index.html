    let currentPlayMode = 'zh'; // 'zh', 'en', 'both'

    // Helper: Build relative path to static audio file
    function getSceneAudioUrl(sceneId, lang) {
      return `audio/scene_${sceneId}_${lang}.wav`;
    }

    // Audio Playback Controller
    function playAudioUrl(url, onEnded) {
      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement.currentTime = 0;
        currentAudioElement = null;
      }

      const wave = document.getElementById('playingWave');
      if (wave) wave.classList.remove('hidden');

      const audio = new Audio(url);
      currentAudioElement = audio;

      audio.onended = () => {
        if (wave) wave.classList.add('hidden');
        currentAudioElement = null;
        if (typeof onEnded === 'function') {
          onEnded();
        }
      };

      audio.onerror = (e) => {
        console.error("Audio playback error:", e, url);
        if (wave) wave.classList.add('hidden');
        showToast(`⚠️ 找不到音檔：${url}\n請確認 audio 資料夾是否與網頁在同一目錄。`);
        if (typeof onEnded === 'function') {
          onEnded();
        }
      };

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Audio play prevented or interrupted:", err);
          if (wave) wave.classList.add('hidden');
        });
      }
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    // Web Audio API Synthesized Bus SFX
    function playSfx(type) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'horn') {
          // Double bus horn
          [440, 554.37].forEach(freq => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
          });
          showToast("📢 叭！叭！公車雙音喇叭響起！");
        } else if (type === 'screech') {
          // Tire brake screech
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.45);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
          showToast("💥 唧——！公車緊急煞停！");
        } else if (type === 'engine') {
          // Low engine rev
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.7);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
          showToast("🚗 轟隆隆！公車引擎發動！");
        }
      } catch (e) {
        console.error("SFX Error:", e);
      }
    }

    function stopAllAudio() {
      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement.currentTime = 0;
        currentAudioElement = null;
      }
      const wave = document.getElementById('playingWave');
      if (wave) wave.classList.add('hidden');

      storyScenes.forEach((_, i) => {
        const card = document.getElementById(`scene-card-${i}`);
        if (card) {
          card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50/40');
        }
        const btn = document.getElementById(`play-btn-${i}`);
        if (btn) {
          btn.innerHTML = `<span>▶️</span> 播放演出`;
          btn.classList.remove('bg-rose-600');
          btn.classList.add('bg-slate-900');
        }
      });
      currentPlayingIdx = -1;
    }

    function renderStoryScenes() {
      const container = document.getElementById('scenesContainer');
      container.innerHTML = storyScenes.map((scene, idx) => {
        const isDriver = scene.role === 'driver';
        const roleLabel = isDriver ? '30歲公車司機' : '12歲頑皮小鴿子';
        const roleBadge = isDriver ? 'bg-sky-100 text-sky-900 border-sky-300' : 'bg-amber-100 text-amber-950 border-amber-300';
        const roleTone = isDriver ? '穩重男中音' : (scene.id === 13 ? '狂暴吶喊男童' : (scene.id === 8 ? '飆速咆哮男童' : '俏皮童聲'));

        return `
        <div id="scene-card-${idx}" class="bg-white rounded-3xl p-5 border-2 border-slate-200 shadow-md hover:shadow-xl transition-all duration-300 relative flex flex-col justify-between">
          <div>
            <!-- Header Badges -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-black px-2.5 py-1 rounded-full border ${scene.badgeColor}">
                ${scene.title}
              </span>
              <span class="text-xs font-bold px-2 py-0.5 rounded-lg border ${roleBadge} flex items-center gap-1 shadow-sm">
                <span>${scene.charIcon}</span> ${roleLabel}
              </span>
            </div>

            <!-- Dialogue Bubble -->
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 mb-3 relative">
              <div class="text-xs font-mono text-indigo-700 font-black mb-1 uppercase tracking-wide flex items-center justify-between">
                <span>🇺🇸 莫·威廉斯原著英文</span>
                <button onclick="playSingleSceneAudio(${idx}, 'en')" class="hover:underline text-[11px] text-indigo-600 font-sans font-bold flex items-center gap-1">
                  <span>🔊</span> 聽英文原音
                </button>
              </div>
              <p class="text-sm md:text-base font-bold text-slate-900 leading-snug font-cartoon">${scene.enText}</p>
              
              <div class="my-2.5 border-t border-slate-200"></div>

              <div class="text-xs font-mono text-amber-800 font-black mb-1 uppercase tracking-wide flex items-center justify-between">
                <span>🇹🇼 台灣繪本中文演繹</span>
                <button onclick="playSingleSceneAudio(${idx}, 'zh')" class="hover:underline text-[11px] text-amber-700 font-sans font-bold flex items-center gap-1">
                  <span>🔊</span> 聽中文演繹
                </button>
              </div>
              <p class="text-sm md:text-base text-slate-800 font-semibold leading-relaxed">${scene.zhText}</p>
            </div>

            <!-- Director Prompt Guide -->
            <div class="text-xs text-slate-600 bg-amber-50/80 p-2.5 rounded-xl border border-amber-200 flex items-start gap-2">
              <span class="text-sm">🎬</span>
              <div>
                <strong class="text-amber-950 font-black">角色情感指導：</strong>
                <span class="text-amber-900">${scene.directorPrompt}</span>
              </div>
            </div>
          </div>

          <!-- Bottom Actions -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <span class="text-[11px] font-bold text-slate-400">
              角色特色：${roleTone}
            </span>

            <button id="play-btn-${idx}" onclick="playScene(${idx})" class="text-xs md:text-sm font-black px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white shadow-md transition active:scale-95 flex items-center gap-1.5">
              <span>▶️</span> 播放演出
            </button>
          </div>
        </div>
        `;
      }).join('');
    }

    function setPlayMode(mode) {
      currentPlayMode = mode;
      ['zh', 'en', 'both'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "px-2.5 py-1 text-xs md:text-sm font-black rounded-xl transition-all bg-white text-amber-900 shadow";
        } else {
          btn.className = "px-2.5 py-1 text-xs md:text-sm font-bold rounded-xl transition-all text-slate-600 hover:text-slate-900";
        }
      });

      const modeNames = {
        zh: "🇹🇼 純中文劇場",
        en: "🇺🇸 純英文原著",
        both: "🎭 雙語雙重奏（英文先講 ➔ 中文跟進表演）"
      };
      showToast(`已切換演出模式：\n【${modeNames[mode]}】`);
    }

    function playScene(idx) {
      if (currentPlayingIdx === idx) {
        stopAllAudio();
        isAutoPlayingAll = false;
        updateGlobalBtn();
        updateStatus("已暫停演出。");
        return;
      }

      stopAllAudio();
      currentPlayingIdx = idx;
      highlightScene(idx);

      const scene = storyScenes[idx];

      const onSceneFinished = () => {
        unhighlightScene(idx);
        if (isAutoPlayingAll && currentPlayingIdx < storyScenes.length - 1) {
          setTimeout(() => {
            playScene(currentPlayingIdx + 1);
          }, 600);
        } else {
          isAutoPlayingAll = false;
          updateGlobalBtn();
          updateStatus("演出完成！可點選下一幕或連續播放全劇。");
        }
      };

      try {
        if (currentPlayMode === 'zh') {
          updateStatus(`正在演出第 ${scene.id} 幕（中文）：【${scene.character}】`);
          const url = getSceneAudioUrl(scene.id, 'zh');
          playAudioUrl(url, onSceneFinished);
        } else if (currentPlayMode === 'en') {
          updateStatus(`正在演出第 ${scene.id} 幕（英文）：【${scene.character}】`);
          const url = getSceneAudioUrl(scene.id, 'en');
          playAudioUrl(url, onSceneFinished);
        } else {
          // 雙語雙重奏：英文先播，接著中文演繹
          updateStatus(`第 ${scene.id} 幕雙語雙重奏（1/2 原著英文）：【${scene.character}】`);
          const enUrl = getSceneAudioUrl(scene.id, 'en');
          playAudioUrl(enUrl, () => {
            if (currentPlayingIdx !== idx) return; // 使用者已中斷或切換
            setTimeout(() => {
              if (currentPlayingIdx !== idx) return;
              updateStatus(`第 ${scene.id} 幕雙語雙重奏（2/2 中文演繹）：【${scene.character}】`);
              const zhUrl = getSceneAudioUrl(scene.id, 'zh');
              playAudioUrl(zhUrl, onSceneFinished);
            }, 300);
          });
        }
      } catch (err) {
        console.error("Scene playback error:", err);
        showToast("⚠️ 語音載入失敗，請確認 audio/ 資料夾內的音檔。");
        unhighlightScene(idx);
      }
    }

    function playSingleSceneAudio(idx, lang) {
      stopAllAudio();
      currentPlayingIdx = idx;
      highlightScene(idx);
      const scene = storyScenes[idx];
      const langLabel = lang === 'zh' ? '中文' : '英文';

      updateStatus(`正在播放第 ${scene.id} 幕【${langLabel}】：${scene.character}`);
      const url = getSceneAudioUrl(scene.id, lang);
      playAudioUrl(url, () => {
        unhighlightScene(idx);
        currentPlayingIdx = -1;
        updateStatus("播放完畢。");
      });
    }

    function highlightScene(idx) {
      const card = document.getElementById(`scene-card-${idx}`);
      if (card) {
        card.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50/40');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      const btn = document.getElementById(`play-btn-${idx}`);
      if (btn) {
        btn.innerHTML = `<span>⏸️</span> 暫停演出`;
        btn.classList.remove('bg-slate-900');
        btn.classList.add('bg-rose-600');
      }
    }

    function unhighlightScene(idx) {
      const card = document.getElementById(`scene-card-${idx}`);
      if (card) {
        card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50/40');
      }
      const btn = document.getElementById(`play-btn-${idx}`);
      if (btn) {
        btn.innerHTML = `<span>▶️</span> 播放演出`;
        btn.classList.remove('bg-rose-600');
        btn.classList.add('bg-slate-900');
      }
    }

    function togglePlayAll() {
      if (isAutoPlayingAll) {
        stopAllAudio();
        isAutoPlayingAll = false;
        updateGlobalBtn();
        updateStatus("已停止連續播放。");
      } else {
        isAutoPlayingAll = true;
        updateGlobalBtn();
        playScene(0);
      }
    }

    function updateGlobalBtn() {
      const icon = document.getElementById('globalPlayIcon');
      const text = document.getElementById('globalPlayText');
      const btn = document.getElementById('globalPlayBtn');
      if (isAutoPlayingAll) {
        icon.innerText = "⏹️";
        text.innerText = "停止連續播放";
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
        btn.classList.add('bg-rose-600', 'hover:bg-rose-700');
      } else {
        icon.innerText = "▶️";
        text.innerText = "連續播放全劇";
        btn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
      }
    }

    function updateStatus(msg) {
      const el = document.getElementById('statusMessage');
      if (el) el.innerText = msg;
    }

    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => {
        t.classList.add('hidden');
      }, duration);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderStoryScenes();
    });
  </script>
</body>
</html>
