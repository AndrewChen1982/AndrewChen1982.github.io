// Web Audio Synthesizer: 包含 6 款繪本專屬情境音效
let audioCtx = null;
function getAudioContext() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
return audioCtx;
}
function playSFX(type) {
try {
const ctx = getAudioContext();
const now = ctx.currentTime;
if (type === 'horn') {
// Bus Horn (雙音頻 440Hz + 554Hz)
[440, 554].forEach(freq => {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.frequency.setValueAtTime(freq, now);
osc.type = 'sawtooth';
gain.gain.setValueAtTime(0.18, now);
gain.gain.setValueAtTime(0, now + 0.18);
gain.gain.setValueAtTime(0.18, now + 0.25);
gain.gain.setValueAtTime(0, now + 0.5);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 0.55);
});
} else if (type === 'truck') {
// 巨型聯結大卡車重低音鳴笛 (Heavy Airhorn 130Hz + 165Hz)
[130, 165].forEach(freq => {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.frequency.setValueAtTime(freq, now);
osc.type = 'sawtooth';
gain.gain.setValueAtTime(0.25, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 1.25);
});
} else if (type === 'engine') {
// 公車引擎拉轉轟鳴 (Vroom!)
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(90, now);
osc.frequency.exponentialRampToValueAtTime(280, now + 0.55);
osc.frequency.exponentialRampToValueAtTime(140, now + 1.1);
gain.gain.setValueAtTime(0.25, now);
gain.gain.linearRampToValueAtTime(0.35, now + 0.45);
gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 1.15);
} else if (type === 'chirp') {
// 鴿子碎碎念拍翅 (Chirp)
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(700, now);
osc.frequency.linearRampToValueAtTime(1050, now + 0.08);
osc.frequency.linearRampToValueAtTime(650, now + 0.16);
gain.gain.setValueAtTime(0.2, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 0.24);
} else if (type === 'tantrum') {
// 世紀大暴走噪音效果（顫動鋸齒波）
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(450, now);
osc.frequency.linearRampToValueAtTime(900, now + 0.2);
osc.frequency.linearRampToValueAtTime(300, now + 0.5);
osc.frequency.linearRampToValueAtTime(800, now + 0.8);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 0.95);
} else if (type === 'disappoint') {
// 悲劇落寞滑音 (Sad descending slide)
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(340, now);
osc.frequency.exponentialRampToValueAtTime(160, now + 0.8);
gain.gain.setValueAtTime(0.2, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(now);
osc.stop(now + 0.9);
}
} catch (e) {
console.warn("AudioContext error:", e);
}
}
// Web Speech Synthesis Engine
let isPlayingAll = false;
let currentIndex = 0;
function speakText(text, lang, pitch = 1.0, rate = 1.0, onEndCallback = null) {
if (!('speechSynthesis' in window)) {
alert("您的瀏覽器暫不支援語音朗讀功能，推薦使用 Chrome / Edge / Safari！");
return;
}
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = lang;
utterance.pitch = pitch;
utterance.rate = rate;
// 選擇自然人聲
const voices = window.speechSynthesis.getVoices();
if (lang.startsWith('en')) {
const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
if (enVoice) utterance.voice = enVoice;
} else {
const zhVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'zh-HK' || v.lang.startsWith('zh')) && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Mei-Jia') || v.name.includes('Ting-Ting') || v.name.includes('Hsiao-Chen')));
if (zhVoice) utterance.voice = zhVoice;
}
utterance.onend = () => {
if (onEndCallback) onEndCallback();
};
utterance.onerror = (e) => {
console.warn("Speech error:", e);
if (onEndCallback) onEndCallback();
};
window.speechSynthesis.speak(utterance);
}
function playCardAudio(index, onFinish = null) {
const mode = document.getElementById('langSelect').value;
const data = storyPages[index];
highlightCard(index);
// 觸發該頁對應的音效
if (data.audioSettings.sfx) {
playSFX(data.audioSettings.sfx);
}
if (mode === 'en') {
speakText(data.enLines, 'en-US', data.audioSettings.enPitch, data.audioSettings.enRate, onFinish);
} else if (mode === 'zh') {
speakText(data.zhStory, 'zh-TW', data.audioSettings.zhPitch, data.audioSettings.zhRate, onFinish);
} else {
// 雙語模式：先念生動中文故事帶氣氛，再播放英文角色原聲
speakText(data.zhStory, 'zh-TW', data.audioSettings.zhPitch, data.audioSettings.zhRate, () => {
setTimeout(() => {
speakText(data.enLines, 'en-US', data.audioSettings.enPitch, data.audioSettings.enRate, onFinish);
}, 350);
});
}
}
function highlightCard(index) {
document.querySelectorAll('.story-card').forEach((card, idx) => {
if (idx === index) {
card.classList.add('active-card');
card.scrollIntoView({ behavior: 'smooth', block: 'center' });
} else {
card.classList.remove('active-card');
}
});
}
function togglePlayAll() {
if (isPlayingAll) {
stopAll();
} else {
startPlayAll();
}
}
function startPlayAll() {
isPlayingAll = true;
document.getElementById('playIcon').innerText = "⏸";
document.getElementById('playText').innerText = "暫停播放";
currentIndex = 0;
playStep();
}
function playStep() {
if (!isPlayingAll || currentIndex >= storyPages.length) {
stopAll();
return;
}
playCardAudio(currentIndex, () => {
currentIndex++;
if (currentIndex < storyPages.length && isPlayingAll) {
setTimeout(playStep, 1000);
} else {
stopAll();
}
});
}
function stopAll() {
isPlayingAll = false;
window.speechSynthesis.cancel();
document.getElementById('playIcon').innerText = "▶";
document.getElementById('playText').innerText = "全書連續播放";
document.querySelectorAll('.story-card').forEach(c => c.classList.remove('active-card'));
}
